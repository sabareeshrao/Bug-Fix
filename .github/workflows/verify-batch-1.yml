name: Validate Batch 1 Challenge
on:
  push:
    branches:
      - 'batch-1-level-*'
permissions:
  contents: read
jobs:
  verify-red-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: workspace/shopizer/pom.xml
      - name: Compile Shopizer with all injected bugs
        working-directory: workspace/shopizer
        run: bash mvnw -pl sm-core -am -DskipTests compile
      - name: Run deliberately failing cart acceptance tests
        working-directory: workspace/shopizer
        shell: bash
        run: |
          set +e
          bash mvnw -pl sm-core -am -Dtest=CartCollectionChallengesTest -Dsurefire.failIfNoSpecifiedTests=false test > /tmp/cart-challenge-tests.log 2>&1
          exitcode=$?
          set -e
          tail -n 90 /tmp/cart-challenge-tests.log
          if [ "$exitcode" -eq 0 ]; then
            echo "ERROR: All challenge tests passed before solving."
            exit 1
          fi
          if ! grep -q 'Tests run: 10' /tmp/cart-challenge-tests.log; then
            echo "ERROR: Could not prove that the 10 acceptance tests executed."
            exit 1
          fi
          echo "Expected: challenge tests executed and some failed until bugs are repaired."
